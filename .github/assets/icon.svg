<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tldw icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>

  <!-- play button (the video) -->
  <path
    d="M52 26 L52 66 L88 46 Z"
    fill="#ffffff"
    stroke="#ffffff"
    stroke-width="9"
    stroke-linejoin="round"/>

  <!-- summary lines (the text it becomes), decreasing width -->
  <g fill="#ffffff">
    <rect x="34" y="82" width="60" height="9" rx="4.5"/>
    <rect x="34" y="97" width="60" height="9" rx="4.5" opacity="0.9"/>
    <rect x="34" y="112" width="38" height="9" rx="4.5" opacity="0.72"/>
  </g>
</svg>
